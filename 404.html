<style>
:root{--bg:#ffffff;--panel:#f5f5f6;--fg:#1d1d1f;--dim:#6b6b70;--line:#e3e3e6;--accent:#e0702c;--accent-fg:#ffffff;--bar:#1d1d1f}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--panel:#1b1b1d;--fg:#ececec;--dim:#9a9aa0;--line:#2c2c30;--accent:#ff8539;--accent-fg:#101010;--bar:#0d0d0d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--bar);color:#fff;height:48px;display:flex;align-items:center;padding:0 16px}
header a{display:flex;align-items:center;color:#fff;text-decoration:none;font-weight:600;font-size:15px}
header img{width:24px;height:24px;margin-right:10px}
main{max-width:560px;margin:72px auto;padding:0 16px;text-align:center}
.code{font-size:64px;font-weight:700;color:var(--accent);line-height:1}
h1{font-size:22px;margin:12px 0 8px}
p{color:var(--dim);margin:0 0 24px}
form{display:flex;margin:0 0 20px}
input{flex:1;min-width:0;padding:10px 12px;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-right:0;border-radius:6px 0 0 6px;outline:none}
input:focus{border-color:var(--accent)}
button{padding:10px 16px;font:inherit;font-weight:600;color:var(--accent-fg);background:var(--accent);border:0;border-radius:0 6px 6px 0;cursor:pointer}
.links a{display:inline-block;margin:0 8px;color:var(--accent);text-decoration:none;font-weight:600}
.links a:hover{text-decoration:underline}
</style></head>

<script>
(function(){
  // The manual lives one folder deep (/v2/ on help.acttrader.com, /trader-manual/ on the
  // preview). Try that folder, then the site root, and keep the first one that holds it.
  var segs = location.pathname.split("/").filter(Boolean);
  var cands = [];
  if (segs.length > 1) cands.push("/" + segs[0] + "/");
  cands.push("/");
  var base = cands[0];
  function apply(b){
    base = b;
    var hs = document.querySelectorAll("a.home");
    for (var i = 0; i < hs.length; i++) hs[i].href = b + "index.html";
    document.getElementById("vids").href = b + "videos/index.html";
  }
  apply(base);
  // Pre-fill search with the words from the mistyped page name.
  var last = (segs[segs.length - 1] || "").replace(/\.html?$/i, "").replace(/[-_]+/g, " ");
  if (last && !/^index$/i.test(last)) document.getElementById("q").value = last;
  (function probe(i){
    if (i >= cands.length || !window.fetch) return;
    fetch(cands[i] + "search/search_index.js", {method:"HEAD"}).then(function(r){
      if (r.ok) apply(cands[i]); else probe(i + 1);
    }).catch(function(){ probe(i + 1); });
  })(0);
  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    var q = document.getElementById("q").value.trim();
    location.href = base + "index.html" + (q ? "?q=" + encodeURIComponent(q) : "");
  });
})();
