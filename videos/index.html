<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ActTrader How-to Videos</title>
<style>
:root {
  --bg: #080808; --panel: #121212; --panel2: #1a1a1a; --border: #262626;
  --text: #ececec; --dim: #9a9a9a; --accent: #FF8539; --accent-bg: rgba(255,133,57,.14);
  --mark: rgba(255,133,57,.35); --shadow: 0 8px 30px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f6f4; --panel: #ffffff; --panel2: #f0efec; --border: #e1dfda;
    --text: #1d1d1d; --dim: #666; --accent: #d9661f; --accent-bg: rgba(217,102,31,.10);
    --mark: rgba(217,102,31,.25); --shadow: 0 8px 30px rgba(0,0,0,.12);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--border); padding: 18px 24px 12px; }
.wrap { max-width: 1280px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 2px; font-weight: 650; }
.sub { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
.search { display: flex; align-items: center; gap: 10px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; height: 46px; }
.search:focus-within { border-color: var(--accent); }
.search svg { flex: none; opacity: .6; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  color: var(--text); font-size: 16px; }
.kbd { color: var(--dim); font-size: 12px; border: 1px solid var(--border);
  border-radius: 5px; padding: 1px 6px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip { border: 1px solid var(--border); background: var(--panel); color: var(--text);
  border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.chip .n { color: var(--dim); margin-left: 4px; }
main { padding: 8px 24px 60px; }
.count { color: var(--dim); font-size: 13px; margin: 14px 0 6px; }
h2 { font-size: 15px; font-weight: 650; margin: 26px 0 12px; color: var(--dim);
  text-transform: uppercase; letter-spacing: .06em; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; cursor: pointer; display: flex; flex-direction: column; text-align: left;
  color: inherit; font: inherit; padding: 0; }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.thumb { position: relative; aspect-ratio: 16 / 8.6; background: #000; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.75); color: #fff;
  font-size: 12px; padding: 1px 6px; border-radius: 4px; }
.play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
.card:hover .play { opacity: 1; }
.play span { width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,.6);
  display: grid; place-items: center; }
.body { padding: 12px 14px 14px; }
.title { font-weight: 600; font-size: 15px; margin: 0 0 4px; }
.sum { color: var(--dim); font-size: 13px; margin: 0; }
.hits { margin: 10px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--border); padding-top: 8px; }
.hits li { font-size: 13px; padding: 3px 0; display: flex; gap: 8px; }
.hits a { color: var(--accent); text-decoration: none; font-variant-numeric: tabular-nums; flex: none; }
.hits a:hover { text-decoration: underline; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.empty { color: var(--dim); text-align: center; padding: 60px 0; }
.player { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; z-index: 10;
  align-items: center; justify-content: center; padding: 20px; }
.player.open { display: flex; }
.pbox { background: var(--panel); border-radius: 12px; overflow: hidden; width: min(1100px, 100%);
  box-shadow: var(--shadow); }
.pbox video { width: 100%; display: block; background: #000; max-height: 75vh; }
.pbar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.pbar .t { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbar button, .pbar a { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; text-decoration: none; }
@media (max-width: 600px) {
  header { padding: 14px 16px 10px; } main { padding: 8px 16px 40px; }
  .kbd { display: none; }
}
</style>
</head>

<header><div class="wrap">

  </div>
</div>

"], [21.3, "Click Start."], [27.9, "The report is ready. Send this file to your broker's support team."]]}, {"id": "T48", "file": "T48_prelogin_settings.mp4", "thumb": "thumbs/T48.jpg", "section": "Getting started", "title": "Settings on the login screen", "summary": "Proxy, language and other settings before you log in.", "dur": 33, "cues": [[2.1, "Some settings are on the login screen, before you log in. Click the gear."], [6.7, "If your network needs a proxy to reach the internet, tick this box and enter its details."], [11.6, "An alternate server is used if your main server cannot be reached. Your broker gives you these."], [16.9, "Theme picks dark or light before you even log in."], [21.3, "Entries lets you add a server that is not in the list, using details from your broker."], [27.8, "Click Save to keep your changes, or Cancel to leave them as they were."]]}, {"id": "T70", "file": "T70_tools_and_help.mp4", "thumb": "thumbs/T70.jpg", "section": "Getting started", "title": "Command palette, Help and sounds", "summary": "Ctrl+K commands, the Help menu, shortcut list, notifications and sounds.", "dur": 68, "cues": [[1.9, "Press Ctrl+K to open the command palette."], [3.7, "It lists what you can type."], [8.7, "Type chart and an instrument, then press Enter, to open its chart."], [15.6, "Type goto and a tab name to jump to that tab."], [22.7, "Buy and sell place an order as soon as you press Enter, so check it first."], [26.7, "Press Escape to close the palette without doing anything."], [34.3, "The question mark at the bottom right is Help."], [37.3, "It opens the Trader Manual, and lists the keyboard shortcuts."], [42.4, "Every shortcut is listed here. Shift+F1 opens this from anywhere."], [53.3, "In Settings, under Trading, you can turn notifications on or off."], [58.7, "Below that, you choose which events play a sound, and how loud."]]}, {"id": "T81", "file": "T81_delete_profile.mp4", "thumb": "thumbs/T81.jpg", "section": "Getting started", "title": "Delete a  "Click the plus button to start a new watchlist."], [9.5, "Give it a name."], [12.5, "Then click Create."], [15.8, "Your new list gets its own tab. It starts empty."], [20.8, "Go back to All to pick instruments."], [24.3, "To add an instrument, right click it and choose Add to Watchlist."], [26.4, "Then pick your list."], [28.8, "Add as many as you like."], [40.2, "Click the tab to see only your instruments."], [44.5, "Prices here update live, just like the main list."], [49.8, "Click All to go back to the full list."]]}, {"id": "T38", "file": "T38_instrument_details.mp4", "thumb": "thumbs/T38.jpg", "section": "Watchlist & instruments", "title": "See an instrument's details and pivots", "summary": "Prices, today's range, contract info and pivot points.", "dur": 50, "cues": [[1.9, "The Instruments tab lists every instrument, grouped by type."], [7.0, "Type in the search box to find one."], [11.4, "Click an instrument to see its details on the right."], [15.6, "Here are the live Sell and Buy prices, the spread and today's change."], [20.5, "Today's range shows the day's low and high, and where the price is now."], [24.9, "Contract info shows the smallest and largest trade size, and the step between sizes."], [30.2, "Pivot points mark today's key support and resistance levels. The arrow is the current price."], [35.6, "Choose how the pivots are worked out."], [41.2, "Sell, Chart and Buy work straight from here."], [45.0, "Below, you see the latest news about this instrument."]]}, {"id": "T45", "file": "T45_quick_trade.mp4", "thumb": "thumbs/T45.jpg", "section": "Watchlist & instruments", "title": "Trade with one click (Quick Trade)", "summary": "Turn on Quick Trade to buy or sell straight from the list.", "dur": 45, "cues": [[2.1, "Quick Trade lets you trade with a single click. Turn it on with this button, or Alt+Q."], [7.7, "A lot size column appears on every row. Use minus and plus to change it."], [12.1, "If the names are cut off, drag the edge to make the watchlist wider."], [20.9, "Now one click on the Ask buys straight away, and one click on the Bid sells. There is no ticket."], [28.6, "The position opens at once."], [33.3, "Closing is instant too: Close Position closes it with no confirmation."], [39.5, "So use Quick Trade with care. Click the button again to turn it off."]]}, {"id": "T61", "file": "T61_watchlist_tabs.mp4", "thumb": "thumbs/T61.jpg", "section": "Watchlist & instruments", "title": "Rename, move or delete watchlist tabs", "summary": "Manage your own watchlist tabs from their right-click menu.", "dur": 46, "cues": [[2.1, "Your own watchlists appear as tabs under the categories."], [6.0, "Right-click a tab to move, rename or delete it."], [8.7, "Move Left and Move Right change the order of your tabs."], [12.6, "Majors now comes after Metals."], [17.9, "Choose Rename to give a tab a new name."], [23.1, "Type the new name and click Save."], [26.9, "The tab shows its new name. The instruments in it stay the same."], [32.7, "Delete Watchlist removes a tab you no longer need."], [36.2, "You are asked to confirm first. Deleting cannot be undone."], [41.3, "The watchlist is gone. Your other lists are not affected."]]}, {"id": "T62", "file": "T62_watchlist_menu.mp4", "thumb": "thumbs/T62.jpg", "section": "Watchlist & instruments", "title": "Watchlist right-click menu", "summary": "Everything you can do from an instrument's right-click menu.", "dur": 61, "cues": [[2.1, "Right-click an instrument to see everything you can do with it."], [4.8, "Open Chart shows it on the chart. Price Alert sets an alert for it."], [9.2, "Market Order Buy and Sell trade at the current price."], [12.7, "Entry Stop and Entry Limit orders wait for a price you choose."], [17.1, "An OCO order is a pair: when one fills, the other is cancelled."], [20.6, "Add to Watchlist puts the instrument in one of your own lists."], [25.4, "Open your list's tab: the instrument is now in it."], [31.1, "In your own list, Remove from Watchlist takes it out again."], [37.5, "Right-click the Bid price for the Sell orders only."], [42.1, "Right-click the Ask price for the Buy orders only."], [51.0, "Choosing an order opens its ticket. Nothing is sent until you confirm."], [56.2, "Press Escape or click the cross to close it without trading."]]}, {"id": "T63", "file": "T63_instruments_watchlist_news.mp4", "thumb": "thumbs/T63.jpg", "section": "Watchlist & instruments", "title": "Add to a watchlist from Instruments, and news", "summary": "Add instruments from their details panel; show the news panel.", "dur": 61, "cues": [[1.9, "On the Instruments tab you can add any instrument to your own watchlists."], [10.6, "Find the instrument and click it to open its details."], [14.8, "Click Add to Watchlist."], [17.7, "Tick the lists it should go in, then click Done."], [22.7, "The star shows it is in one of your lists."], [31.9, "On the Trading tab, it now appears in that watchlist."], [40.6, "Press Alt+W to show or hide the news panel."], [44.8, "Market News shows the latest stories as they come in."], [51.0, "The details panel also lists news about the selected instrument."], [55.1, "Press Alt+W again to hide the news panel."]]}, {"id": "T74", "file": "T74_watchlist_extras.mp4", "thumb": "thumbs/T74.jpg", "section": "Watchlist & instruments", "title": "More from the watchlist", "summary": "The Bid and Ask menus, keyboard use, and the High, Low and % Chg columns.", "dur": 47, "cues": [[1.9, "Right-click a Bid price for a short menu with only the Sell orders."], [4.4, "It is headed by the instrument, the side and the price."], [8.4, "An Ask price gives the Buy orders. Escape closes the menu."], [13.2, "For the keyboard, first click an instrument in the list."], [15.8, "Down and Up move through the list. The chart stays as it is."], [19.2, "Enter shows the highlighted instrument on the chart."], [22.1, "The Menu key on your keyboard opens the right-click menu."], [25.9, "Alt+F jumps to the search box. Escape clears it."], [31.2, "Three more columns can be shown. Right-click a column heading."], [35.0, "Choose Customize columns, then tick High, Low and % Chg."], [41.1, "High and Low show today's range, and % Chg today's change."]]}, {"id": "T79", "file": "T79_instruments_extras.mp4", "thumb": "thumbs/T79.jpg", "section": "Watchlist & instruments", "title": "More from the Instruments tab", "summary": "The right-click menu, the pivot formula, and the hidden columns.", "dur": 36, "cues": [[1.9, "The Instruments tab lists every instrument your broker offers, grouped by type."], [4.0, "Right-click an instrument for its chart, a price alert, or an order."], [9.5, "In the detail panel, click the pivot method to choose another formula."], [12.2, "Pick Classic, Woodie, Camarilla, Fibonacci or DeMark."], [14.7, "The levels are worked out again with the new formula."], [18.6, "Six more columns are hidden as standard. Right-click a heading and choose Customize."], [22.1, "Tick MaxVol, the rollover columns, ImmD, Trade Step and NT Interval."], [30.1, "They now appear as columns. Customize again hides them."]]}, {"id": "T14", "file": "T14_oco_order.mp4", "thumb": "thumbs/T14.jpg", "section": "Orders & trading", "title": "Place an OCO order", "summary": "Two orders at once: when one trades, the other is cancelled.", "dur": 41, "cues": [[2.1, "An OCO order places two orders at once. When one trades, the other is cancelled."], [8.1, "Right click an instrument and choose Entry OCO Buy."], [11.9, "It opens on the OCO tab."], [15.3, "The Stop rate buys if the price breaks up above it."], [19.4, "The Limit rate buys if the price dips down to it."], [24.3, "Click Buy to place both orders together."], [30.6, "Both orders now wait under Pending."], [34.8, "As soon as one of them trades, the other one is cancelled for you."]]}, {"id": "T20", "file": "T20_market_order.mp4", "thumb": "thumbs/T20.jpg", "section": "Orders & trading", "title": "Place a market order", "summary": "Buy or sell at the current price from the watchlist.", "dur": 46, "cues": [[2.1, "To place a trade, right click an instrument in the watchlist."], [5.5, "Choose Market Order Buy."], [9.3, "The order ticket opens. A market order trades at the current price."], [13.7, "Pick Buy or Sell here."], [17.1, "These are the live prices you will get."], [20.9, "Set how much to trade. This is the smallest size, 0.01 lots."], [25.3, "Trader Range is how many pips the price may slip and still fill."], [29.6, "You can add a stop loss or take profit now, or later."], [33.5, "Click Buy to place the order."], [40.0, "Your new trade appears straight away under Open positions."]]}, {"id": "T21", "file": "T21_sl_tp.mp4", "thumb": "thumbs/T21.jpg", "section": "Orders & trading", "title": "Set a stop loss and take profit", "summary": "Limit your loss and lock in your gain on an open trade.", "dur": 58, "cues": [[2.1, "A stop loss limits your loss. A take profit locks in your gain."], [7.9, "Right click your trade and choose Stop."], [11.7, "Set the price where you want to get out if the market goes against you."], [16.1, "It shows the distance in points and what you would lose."], [20.6, "Click OK."], [26.2, "The stop loss now shows in the Stop column."], [34.1, "For a take profit, right click the trade and choose Limit."], [38.0, "Set the price where you want to take your profit."], [42.3, "Again it shows the distance and what you would make."], [46.3, "Click OK."], [51.9, "Now the trade has both: a stop loss and a take profit."]]}, {"id": "T22", "file": "T22_close_position.mp4", "thumb": "thumbs/T22.jpg", "section": "Orders & trading", "title": "Close a position", "summary": "Take your profit or loss by closing a trade.", "dur": 52, "cues": [[2.1, "When you are ready to take your profit or loss, close the trade."], [7.9, "Right click it and choose Close Position."], [11.7, "The window shows which position you are closing."], [15.6, "You can close all of it, or just part, by changing the amount."], [19.9, "Use current dealing rate closes at the live price."], [23.9, "Click OK to close it."], [29.7, "The trade is gone from your open positions."], [33.6, "Open the Closed tab to see trades you have closed."], [37.5, "Pick how far back to look, for example 1 Month."], [46.0, "Each closed trade shows its open and close price and its final profit or loss."]]}, {"id": "T23", "file": "T23_pending_order.mp4", "thumb": "thumbs/T23.jpg", "section": "Orders & trading", "title": "Place a pending (limit) order", "summary": "An order that waits until the price reaches your level.", "dur": 44, "cues": [[2.1, "A pending order waits and only trades when the price reaches your level."], [7.6, "Right click an instrument. There are Stop and Limit entry orders."], [10.6, "A Limit Buy buys if the price falls to your level. Choose Entry Limit Buy."], [15.4, "The ticket opens on the Limit tab."], [18.8, "Set how far from today's price it should wait, in pips."], [23.3, "The rate updates to match: this is the price it will buy at."], [27.6, "Click Buy to place the order."], [33.5, "It is waiting now, under Pending."], [37.4, "It stays here until the price reaches it, or until you cancel it."]]}, {"id": "T24", "file": "T24_modify_cancel_order.mp4", "thumb": "thumbs/T24.jpg", "section": "Orders & trading", "title": "Change or cancel a pending order", "summary": "Modify a pending order's rate or amount, or cancel it.", "dur": 52, "cues": [[2.1, "You can change a pending order at any time before it trades."], [7.8, "Right click it and choose Modify Order."], [11.7, "Type a new entry rate."], [16.1, "You can change the amount here too."], [20.1, "Click Modify to save it."], [26.0, "The new rate shows in the Rate column."], [31.8, "To cancel it, right click and choose Remove Order."], [36.2, "You are asked to confirm, so a slip of the mouse cannot cancel it."], [40.6, "Click OK to cancel the order."], [46.4, "The order is cancelled and removed from Pending."]]}, {"id": "T25", "file": "T25_quick_order_hedge.mp4", "thumb": "thumbs/T25.jpg", "section": "Orders & trading", "title": "Quick order and hedge", "summary": "Click a price to open an order; hedge an open trade.", "dur": 42, "cues": [[2.1, "The quickest way to trade: click a price in the watchlist."], [6.4, "Clicking the Ask opens a Buy. Clicking the Bid opens a Sell."], [10.8, "Click Buy to place it."], [17.3, "To hedge a trade, click the H next to it."], [21.1, "The ticket is set up for you: the opposite side, the same amount."], [25.5, "The comment links it to the trade it protects."], [29.3, "Click Sell to open the hedge."], [35.6, "Now you hold a Buy and a Sell of the same size, so the price no longer moves your profit."]]}, {"id": "T26", "file": "T26_trailing_stop.mp4", "thumb": "thumbs/T26.jpg", "section": "Orders & trading", "title": "Use a trailing stop", "summary": "A stop that follows the price as it moves in your favour.", "dur": 44, "cues": [[2.1, "A trailing stop follows the price as it moves in your favour."], [7.9, "Right click your trade and choose Trailing Stop."], [12.1, "Set Trailing Stop Distance is already ticked."], [15.9, "With trailing on, the stop is set by the distance below, not by this rate."], [22.0, "Then choose how far behind the price the stop should follow."], [26.0, "Click OK."], [32.8, "The trade now shows its stop, and the trailing distance under TR.STOP."], [37.7, "As the price rises, the stop moves up with it. It never moves back down."]]}, {"id": "T41", "file": "T41_bulk_close.mp4", "thumb": "thumbs/T41.jpg", "section": "Orders & trading", "title": "Close several positions at once", "summary": "Bulk Operations closes many trades together.", "dur": 32, "cues": [[2.1, "With several positions open, you can close them together."], [6.0, "Click Bulk Operations."], [9.6, "Close all positions, only the ones in profit, or only the ones at a loss."], [16.2, "You are asked to confirm, with the number of positions that will close."], [20.5, "Click Close Positions."], [27.1, "Both positions are closed at the current price."]]}, {"id": "T54", "file": "T54_entry_stop_vs_limit.mp4", "thumb": "thumbs/T54.jpg", "section": "Orders & trading", "title": "Entry Stop vs Entry Limit", "summary": "Which entry order to use when the price rises or falls to your level.", "dur": 55, "cues": [[2.1, "An entry order waits until the price reaches a level you choose. Right-click an instrument."], [4.9, "Entry Stop Buy buys if the price rises to your level."], [8.8, "Entry Limit Buy buys if the price falls to your level."], [12.6, "Pick Entry Stop Buy."], [15.9, "The rate starts 10 pips above the current price."], [19.7, "Change the distance in pips, here to 30. The rate moves with it."], [23.9, "Click Buy to place the order."], [28.6, "It waits in the Pending tab until the price gets there."], [32.4, "ES means entry stop. Proximity shows how many pips the price still has to go."], [37.3, "Its line is above the chart, so this arrow points to it."], [43.2, "For a limit, pick Entry Limit Buy instead."], [46.4, "Now the rate starts below the price, because a limit buys cheaper."], [50.8, "Close the window to leave it."]]}, {"id": "T55", "file": "T55_partial_close.mp4", "thumb": "thumbs/T55.jpg", "section": "Orders & trading", "title": "Close part of a position", "summary": "Close only some of a trade's size.", "dur": 35, "cues": [[2.1, "This trade is 0.02 lots. You can close just part of it."], [8.3, "Right-click it and pick Close Position."], [11.5, "Change the amount to the part you want to close, here 0.01."], [15.8, "You can also drag this slider."], [19.1, "Click Ok."], [24.3, "0.01 is closed. The other 0.01 stays open."], [28.7, "The chart line now shows 0.01 too. Close the rest the same way when you are ready."]]}, {"id": "T56", "file": "T56_position_menu.mp4", "thumb": "thumbs/T56.jpg", "section": "Orders & trading", "title": "Open-position right-click menu", "summary": "Every action available on an open trade.", "dur": 40, "cues": [[2.1, "Right-click an open trade to see everything you can do with it."], [5.5, "Stop sets a stop loss, and Limit sets a take profit."], [9.1, "Trailing Stop moves your stop along as the price moves your way."], [12.8, "Bulk Operations closes many trades at once, like all profitable ones."], [17.1, "Close Position closes this trade. Hedge opens the opposite trade. The shortcut keys are shown on the right."], [22.5, "Copy Trade ID copies its number, for example to send to support."], [26.2, "Export to Excel saves the table, and Filters narrow down what it shows."], [30.5, "View on Chart shows the trade's chart."], [34.8, "The chart shows this trade's instrument, with the trade drawn on it."]]}, {"id": "T57", "file": "T57_pending_menu_bulk_cancel.mp4", "thumb": "thumbs/T57.jpg", "section": "Orders & trading", "title": "Pending-order menu and bulk cancel", "summary": "Actions on pending orders, including cancelling many at once.", "dur": 54, "cues": [[2.1, "Pending orders wait here until the price reaches them. Right-click one to see what you can do."], [5.8, "Modify Order changes its rate or amount."], [9.0, "Remove Order cancels just this one."], [12.3, "Stop and Limit attach a stop loss and take profit that start working once the order fills."], [15.9, "The stop is measured from the price the order will fill at, not today's price."], [20.7, "Click Ok to save it, or Cancel to leave it."], [26.2, "Trailing Stop attaches a stop that follows the price once the order fills."], [30.1, "Comment adds a short note to the order."], [33.5, "Bulk Operations cancels many orders at once: all of them, only limits, or only stops."], [37.1, "Click Cancel All Orders."], [40.3, "It asks first, and shows how many orders will be cancelled."], [43.7, "Click Cancel Orders."], [49.2, "All pending orders are cancelled."]]}, {"id": "T58", "file": "T58_grouped_positions.mp4", "thumb": "thumbs/T58.jpg", "section": "Orders & trading", "title": "Group positions by instrument", "summary": "Show one row per instrument when you hold many trades.", "dur": 39, "cues": [[2.1, "Here are two EURUSD trades. When you hold many trades, grouping makes the list shorter."], [6.0, "Turn on Grouped."], [9.5, "Now there is one row per instrument, with the total size of all its trades."], [13.8, "The open price is their average, marked with a wavy sign."], [17.7, "Click the arrow to see the trades inside the group."], [21.2, "Each trade is listed underneath, and you can still work with each one."], [25.6, "The X on the group row closes all of its trades together."], [31.8, "Turn Grouped off to see every trade on its own row again."]]}, {"id": "T59", "file": "T59_default_order_distances.mp4", "thumb": "thumbs/T59.jpg", "section": "Orders & trading", "title": "Set default order distances", "summary": "Default stop, limit and entry distances per instrument.", "dur": 50, "cues": [[2.0, "Open Settings with the gear icon."], [5.2, "Go to the Trading section."], [8.4, "Default Orders Distance sets how far from the price your stop, limit and entry orders start."], [13.3, "Click Configure."], [17.6, "Min. Distance is your broker's minimum for each instrument."], [22.1, "Grey values follow that minimum. Your own values show in bold."], [26.4, "Search to find an instrument."], [30.4, "Click a value to change it. Here, the stop distance."], [33.8, "Type the distance in pips."], [38.8, "Now every new EURUSD stop starts 10 pips from the price."], [43.2, "Reset all distances to go back to your broker's minimums."]]}, {"id": "T72", "file": "T72_remove_sl_tp.mp4", "thumb": "thumbs/T72.jpg", "section": "Orders & trading", "title": "Remove a stop loss or take profit", "summary": "Take a stop or limit off a trade, from its window or the chart.", "dur": 40, "cues": [[2.1, "This trade has a stop loss and a take profit."], [7.4, "To remove the stop loss, right-click the trade and choose Stop."], [11.6, "Click Remove. There is no confirmation, so be sure first."], [17.7, "The stop loss is gone. The trade is no longer protected below."], [23.5, "The take profit works the same way: choose Limit."], [27.7, "Click Remove."], [33.3, "Now the trade has neither. You can also remove them on the chart with the X on their label."]]}, {"id": "T76", "file": "T76_pending_extras.mp4", "thumb": "thumbs/T76.jpg", "section": "Orders & trading", "title": "More with pending orders", "summary": "Enter to change an order, add a comment, and remove several at once.", "dur": 48, "cues": [[1.9, "Two Entry Limit orders are waiting on the Pending tab."], [4.8, "Select an order and press Enter to change its rate or amount."], [8.1, "Escape closes the window without changing anything."], [12.2, "To add a note to an order, right-click it and choose Comment."], [14.5, "Type up to 50 characters, then click Ok."], [18.1, "The order is updated with your note."], [23.4, "Choose Comment again to read or change it."], [27.8, "Ctrl+A selects every order."], [32.0, "The menu now reads Remove 2 Orders."], [36.3, "You are asked to confirm before anything is cancelled."], [43.6, "Both orders are cancelled."]]}, {"id": "T05", "file": "T05_chart.mp4", "thumb": "thumbs/T05.jpg", "section": "Charts", "title": "Read the chart", "summary": "Candles, prices, timeframes (1m to 1M) and the date range buttons.", "dur": 52, "cues": [[2.1, "The chart shows the instrument you picked in your watchlist."], [5.5, "Each candle is one slice of time. Green means the price went up, red means down."], [9.3, "Prices run down the right-hand side. The tag shows the live price."], [13.2, "Time runs along the bottom."], [16.0, "Click the timeframe button to change how long each candle covers."], [18.8, "Pick 5m: every candle is five minutes."], [25.6, "1h gives a wider view, one candle per hour. Daily, weekly and monthly are further down."], [31.4, "These buttons along the bottom set how far back you look."], [33.4, "5D shows the last five days."], [38.7, "1D brings you back to today."], [44.9, "Pick 1m again for one-minute candles."]]}, {"id": "T06", "file": "T06_indicators.mp4", "thumb": "thumbs/T06.jpg", "section": "Charts", "title": "Add indicators", "summary": "Search and add indicators; hide, set up or remove them; hide the drawing bar.", "dur": 40, "cues": [[2.1, "Indicators are extra lines that help you read the chart. Click Indicators."], [5.1, "There are dozens, in groups: trend, momentum, volatility, volume and more."], [8.8, "Type part of the name to find one."], [11.2, "Click it and it appears on your chart straight away."], [16.4, "Each indicator gets a small tag on the chart."], [19.1, "The eye hides it for a moment. Click again to show it."], [24.4, "The gear opens its settings, such as the period and colour."], [27.6, "The X removes it."], [31.1, "The pencil button hides or shows the drawing tools on the left."]]}, {"id": "T07", "file": "T07_multichart.mp4", "thumb": "thumbs/T07.jpg", "section": "Charts", "title": "Show several charts at once", "summary": "Multi-chart layouts.", "dur": 69, "cues": [[2.1, "You can show more than one chart at a time."], [6.3, "Pick how many charts you want on screen."], [13.5, "Two by two gives you four charts."], [17.4, "Linked is on, so picking an instrument changes every chart at once."], [24.9, "Click Linked to turn that off."], [28.7, "Now click a chart to make it the active one."], [35.5, "A new instrument opens only in the active chart."], [44.0, "Back to a single chart."], [47.3, "The gear opens the chart's own settings."], [50.5, "Here you can change the chart colours."], [56.6, "New chart opens a chart in its own separate window."]]}, {"id": "T18", "file": "T18_floating.mp4", "thumb": "thumbs/T18.jpg", "section": "Charts", "title": "Pop out charts and panels", "summary": "Open charts or panels in their own windows.", "dur": 40, "cues": [[2.1, "You can pop parts of ActTrader out into their own windows."], [5.1, "New chart opens a chart in a window of its own."], [10.2, "Drag the title bar to move it anywhere, even onto another screen."], [14.2, "The buttons on the right minimise it, make it full size, or close it."], [17.8, "The X closes it."], [22.2, "Right click a tab along the top to undock it."], [26.2, "Summary now has its own window, so you can keep it open while you trade."], [31.5, "Click its X to put it back in the main window."], [35.4, "It is back in its tab, right where it started."]]}, {"id": "T36", "file": "T36_chart_trade.mp4", "thumb": "thumbs/T36.jpg", "section": "Charts", "title": "Place an order from the chart", "summary": "Pick a price on the chart and place an order there.", "dur": 52, "cues": [[2.1, "You can place an order straight from the chart."], [6.5, "Point at the price you want. A plus appears on the right. Click it."], [11.2, "Below the market you can Buy Limit or Sell Stop. Choose Buy Limit."], [16.3, "A draft order line appears at that price. Nothing is sent yet."], [20.6, "Drag SL down to add a stop loss. It shows what you would lose."], [28.1, "Drag TP up to add a take profit. It shows what you would gain."], [35.5, "Click the tick to place the order."], [41.8, "It is now a pending order, drawn on the chart with its stop and limit."], [46.2, "It is also listed in the Pending tab."]]}, {"id": "T37", "file": "T37_chart_drawing.mp4", "thumb": "thumbs/T37.jpg", "section": "Charts", "title": "Draw on the chart", "summary": "The drawing tool groups: trend lines, Fibonacci and more.", "dur": 48, "cues": [[2.1, "The toolbar on the left of the chart holds the drawing tools."], [7.0, "Each button opens a group of tools. Pick Trend Line."], [11.4, "Click where the line starts, then click where it ends."], [18.8, "Click a drawing to select it. The bar above lets you change its colour, width and style."], [23.1, "Press Delete to remove it."], [25.4, "The next button holds the Fibonacci and Gann tools."], [28.4, "Pick Fibonacci Retracement."], [31.8, "Click the start of the move, then the end."], [37.2, "The retracement levels are drawn between the two points, with their prices."], [42.5, "Further down: shapes, measuring tools, pitchforks, text and notes, patterns and more."]]}, {"id": "T40", "file": "T40_chart_sl_tp.mp4", "thumb": "thumbs/T40.jpg", "section": "Charts", "title": "Move stop loss / take profit on the chart", "summary": "Drag your trade's SL and TP lines on the chart.", "dur": 42, "cues": [[2.1, "Your open trade is drawn on the chart as a line at its opening price."], [6.5, "Click its label to edit it."], [10.6, "Drag SL down to set a stop loss. The label shows what you would lose there."], [18.1, "Drag TP up to set a take profit, and see what you would gain."], [25.5, "Click the tick to save both."], [32.3, "The trade now shows its Stop and Limit prices."], [36.7, "To change them later, click the trade on the chart and drag the lines again."]]}, {"id": "T49", "file": "T49_chart_range_style.mp4", "thumb": "thumbs/T49.jpg", "section": "Charts", "title": "Chart date range and style", "summary": "How far back the chart shows, and candle or line style.", "dur": 57, "cues": [[2.1, "These buttons under the chart choose how far back it shows."], [5.3, "1M loads the last month. Scroll left to see all of it."], [11.0, "The chart picks a candle size that fits the period."], [14.8, "1Y shows a whole year."], [23.4, "1D brings you back to today."], [29.2, "This button changes the chart style."], [32.7, "Candles are the default. Line shows only the closing prices."], [42.2, "Heikin Ashi smooths the candles so trends are easier to see."], [51.8, "Pick Candles to go back to the usual view."]]}, {"id": "T50", "file": "T50_indicator_settings.mp4", "thumb": "thumbs/T50.jpg", "section": "Charts", "title": "Change indicator settings", "summary": "Adjust an indicator's period, colours and more.", "dur": 44, "cues": [[2.1, "Every indicator has settings you can change. First add one: click Indicators."], [6.2, "Pick Moving Average."], [12.5, "It is added with a tag. The gear opens its settings."], [17.0, "Period is how many candles it averages. Change 20 to 50 for a smoother line."], [20 y without asking."]]}, {"id": "T53", "file": "T53_chart_buy_sell_strip.mp4", "thumb": "thumbs/T53.jpg", "section": "Charts", "title": "One-click Buy/Sell above the chart", "summary": "Trade the charted instrument from the Buy/Sell strip.", "dur": 29, "cues": [[2.1, "Above the chart is a one-click Buy and Sell strip for the instrument you are viewing."], [6.5, "Sell shows the price you sell at. Buy shows the price you buy at."], [10.7, "Set the size in the middle, or use the arrows."], [14.6, "One click on Buy places the order straight away, so check the size first."], [20.5, "The trade is open, at the size you set."], [24.4, "It is drawn on the chart too."]]}, {"id": "T75", "file": "T75_chart_extras.mp4", "thumb": "thumbs/T75.jpg", "section": "Charts", "title": "More chart controls", "summary": "Pick a symbol on the chart, undock a chart, the Actions menu, full screen and charts off.", "dur": 45, "cues": [[1.9, "Click the instrument name on the chart to pick another one."], [4.5, "Type part of the name, then click the instrument."], [11.0, "Right-click the chart for its own menu."], [13.2, "Undock this chart opens it in a window of its own."], [17.6, "The button at the top of the drawing bar opens the Actions menu."], [19.8, "Undo, redo, delete, clear, hide or lock the drawings on this chart."], [24.7, "Toggle Fullscreen gives the chart the whole window."], [28.2, "Click the same button again to bring the panels back."], [32.9, "This button turns all charts off, to save memory and processor time."], [36.4, "Click it again to turn them back on."]]}, {"id": "T78", "file": "T78_floating_combine.mp4", "thumb": "thumbs/T78.jpg", "section": "Charts", "title": "Combine floating windows", "summary": "Put two panels in one window, tear a tab off, and dock them back.", "dur": 46, "cues": [[1.9, "Right-click a tab, such as Summary, and undock it."], [6.7, "Summary now has a window of its own."], [9.6, "Undock a second panel, here Instruments."], [15.5, "With two panels floating, a + appears in the title bar."], [17.8, "Pick a panel to bring it into this window as a tab."], [21.2, "Click the tabs to switch between the panels."], [25.9, "The arrow on a tab moves it out into a window of its own again."], [30.5, "The first button minimises a window to the taskbar."], [33.0, "The next makes it full size, and restores it again."], [35.6, "The X puts the panel back in the main window."], [41.4, "Both panels are back in their tabs."]]}, {"id": "T86", "file": "T86_bar_replay.mp4", "thumb": "thumbs/T86.jpg", "section": "Charts", "title": "Bar Replay", "summary": "Replay the market candle by candle: start bar, play, step, speed.", "dur": 56, "cues": [[2.1, "Replay plays the market back candle by candle, so you can practise or check an idea."], [6.2, "A replay bar opens under the chart. First pick where the replay starts."], [9.1, "Click the candle to start from."], [12.3, "Everything after that candle is hidden."], [15.7, "Play adds the next candles one by one."], [21.5, "Click it again to pause."], [24.6, "This button moves forward one candle at a time."], [30.4, "Choose how fast it plays."], [35.3, "Now it plays three times faster."], [41.9, "This arrow can also start from a date, the first candle, or a random one."], [47.5, "The X ends the replay and brings back the live chart."]]}, {"id": "T87", "file": "T87_go_to_date_scale.mp4", "thumb": "thumbs/T87.jpg", "section": "Charts", "title": "Go to a date and price scale", "summary": "Jump the chart to a date; percent, log and auto scale.", "dur": 43, "cues": [[2.1, "The calendar button jumps the chart to a date."], [4.8, "Type the date, month first."], [8.3, "Click Go. Older history is loaded if needed."], [14.8, "The chart now shows that day, in your app's time zone."], [18.6, "1D brings you back to today."], [24.2, "% shows the price scale as a percentage change."], [30.8, "log uses a logarithmic scale, useful over long periods."], [37.3, "auto keeps all the candles in view as you scroll. It is on by default."]]}, {"id": "T88", "file": "T88_indicator_templates.mp4", "thumb": "thumbs/T88.jpg", "section": "Charts", "title": "Indicator templates", "summary": "Save a set of indicators and put it on any chart; indicators stay when you change instrument.", "dur": 76, "cues": [[2.1, "Add the indicators you use. Open Indicators and search for one."], [11.0, "EMA and RSI are now on the chart."], [19.7, "At the bottom of the list, Save current indicators keeps this set as a template."], [21.5, "Give it a name and press Enter."], [29.5, "The template is listed here, ready for any chart."], [34.0, "Indicators belong to the chart, so they stay when you change instrument."], [43.7, "GBPUSD opens with the same EMA and RSI."], [47.0, "Remove one with its X."], [56.3, "Click the template to put its indicators back on the chart."], [67.7, "The X next to a template deletes it."]]}, {"id": "T89", "file": "T89_chart_cursor_side_panel.mp4", "thumb": "thumbs/T89.jpg", "section": "Charts", "title": "Cursors, icons and the side panel", "summary": "Cursor modes, icons, Data Window and Objects, and the trade-lines switch.", "dur": 53, "cues": [[2.1, "The top button of the drawing bar sets the cursor."], [4.6, "Cross, dot or arrow, an eraser for drawings, or zoom in on an area."], [7.6, "Demonstration draws a trail that fades, handy when you show the chart to someone."], [16.7, "This button adds icons and emoji to mark the chart."], [23.2, "This button opens the side panel."], [26.2, "Data Window shows the values of the candle under the cursor."], [31.0, "Objects lists the drawings on this chart."], [35.5, "Close the panel with its X. Each chart remembers if its panel is open."], [38.5, "This button turns trading from the chart on and off: your trade lines hide or show."], [45.2, "The menu at the top of the bar can clear all drawings."]]}, {"id": "T90", "file": "T90_chart_order_amount.mp4", "thumb": "thumbs/T90.jpg", "section": "Charts", "title": "Change an order's amount on the chart", "summary": "Edit a pending order's size with the pencil, then remove it.", "dur": 42, "cues": [[3.0, "Place an order from the chart: point above the market and click the plus."], [5.5, "Pick Sell Limit, then click the tick to send it."], [13.1, "The pending order is drawn on the chart: Sell 0.01."], [15.8, "To change it, click the pencil on its label."], [18.6, "Click the amount, then use plus or minus."], [23.0, "Click the tick. The order is changed to 0.02 on the server."], [28.0, "The Pending tab shows the new amount."], [31.4, "The X on the label removes the order. You are asked first."], [38.5, "The order is gone."]]}, {"id": "T08", "file": "T08_positions.mp4", "thumb": "thumbs/T08.jpg", "section": "Positions & tables", "title": "Read the positions table", "summary": "What each column of your open trades means.", "dur": 110, "cues": [[4.3, "The panel at the bottom shows your trades."], [9.3, "Instrument is what you bought or sold."], [13.7, "B or S tells you if it was a buy or a sell."], [18.0, "Amount is how much you traded."], [22.8, "Open is the price you got in at."], [27.6, "P/L is your profit or loss right now."], [32.5, "Net P/L is the same but after costs."], [38.7, "Pending shows orders waiting to happen."], [45.6, "Closed shows trades you have already finished."], [53.1, "Open brings you back to your live trades."], [58.3, "Filters let you narrow down what you see."], [63.7, "Export CSV saves the list to a file."]]}, {"id": "T29", "file": "T29_columns.mp4", "thumb": "thumbs/T29.jpg", "section": "Positions & tables", "title": "Choose and resize table columns", "summary": "Show, hide, reorder and resize columns.", "dur": 41, "cues": [[2.1, "You can choose which columns every table shows."], [7.0, "Right click any column header."], [9.0, "Choose Customize."], [12.4, "Tick a column to show it, untick to hide it."], [19.0, "Select one and use the arrows to move it."], [22.1, "Default puts everything back as it was."], [25.4, "Click OK."], [30.6, "The table changes straight away, and remembers your choice."], [35.0, "Drag the edge of a header to make a column wider or narrower."]]}, {"id": "T30", "file": "T30_export_csv.mp4", "thumb": "thumbs/T30.jpg", "section": "Positions & tables", "title": "Export a table to a spreadsheet", "summary": "Save any table as a CSV file.", "dur": 39, "cues": [[1.9, "You can save any table as a spreadsheet file."], [12.8, "Here are your closed trades for the last month."], [16.6, "Click Export CSV."], [19.9, "It tells you what will be saved: the table, and how many rows and columns."], [24.7, "Click Export and the file opens in your spreadsheet app, such as Excel."], [29.1, "Or Cancel if you change your mind."], [33.9, "Export CSV works the same on every table in the app."]]}, {"id": "T47", "file": "T47_sort_filter.mp4", "thumb": "thumbs/T47.jpg", "section": "Positions & tables", "title": "Sort and filter a table", "summary": "Sort by any column and filter, for example by instrument.", "dur": 53, "cues": [[13.9, "Every table can be sorted and filtered. Here is the Closed tab."], [17.8, "Click a column header to sort by it. Click again to reverse the order."], [24.0, "Click Filters to show a filter box under each header."], [27.8, "Click the one for the column you want, here Instrument."], [31.6, "Move instruments between Visible and Invisible. This button hides them all."], [34.9, "Then pick one, here AUDCAD, and move it back to Visible."], [39.2, "Click Ok."], [43.5, "Now only AUDCAD trades are listed."], [47.4, "Click the cross next to Filters to clear every filter."]]}, {"id": "T71", "file": "T71_select_several.mp4", "thumb": "thumbs/T71.jpg", "section": "Positions & tables", "title": "Select several trades at once", "summary": "Ctrl+Click, Shift+Click and Ctrl+A on Open and Pending, and what the keys do.", "dur": 44, "cues": [[2.1, "You can work with several trades at once. Click one to select it."], [5.5, "Hold Ctrl and click another to add it."], [8.1, "Shift and click selects every trade in between."], [13.7, "Now the menu acts on all of them, for example Close 2 Positions."], [19.1, "Press Escape to go back to a single trade."], [22.3, "With a trade clicked, Ctrl+A selects every trade in the table."], [27.3, "The keyboard works too. Use Up and Down to move between trades."], [30.6, "Alt+C opens Close Position for the selected trade. We will cancel it here."], [34.9, "Alt+T sets a stop loss, Alt+L a take profit, and Alt+H opens a hedge."], [38.9, "Careful: Delete and Ctrl+C also close the selected trade here."]]}, {"id": "T73", "file": "T73_filters.mp4", "thumb": "thumbs/T73.jpg", "section": "Positions & tables", "title": "Filter a table", "summary": "Range, text and date filters on a column, and clearing them all.", "dur": 49, "cues": [[2.1, "Filters show only the rows you want. Click Filters."], [5.5, "A filter box appears under each column."], [9.4, "Number columns, like Open price, get a range filter."], [12.9, "Choose greater than, less than, equal or between, and type a value."], [15.5, "Click Ok."], [19.7, "No trade opened at 2 or higher, so the table is now empty."], [24.1, "The cross on Filters clears every filter, and the rows come back."], [28.8, "Text columns, like Account, match any text you type."], [36.5, "Date columns offer Current Day, Current Shift, or a From and Till range."], [43.4, "Filters on different columns work together. A row must match all of them."]]}, {"id": "T77", "file": "T77_closed_period_reason.mp4", "thumb": "thumbs/T77.jpg", "section": "Positions & tables", "title": "Closed trades for any period", "summary": "A custom period, the Reason column, and the rollover time and clock.", "dur": 47, "cues": [[1.9, "The Closed tab lists the trades you have closed. It starts with the last day."], [4.2, "Click the period button to look further back."], [7.0, "Pick 5 Days, 1 Month or 6 Months, or Custom for your own dates."], [8.7, "For Custom, type the From and Till dates."], [14.3, "Click Show Result."], [19.9, "Every trade closed in that range is listed."], [23.3, "To add a column, right-click a heading and choose Customize."], [29.6, "Tick Reason, then click Ok."], [34.4, "Reason shows why a trade closed, such as S for stop loss or L for take profit. A dash means you closed it."], [39.3, "The arrow at the right of the status bar shows the rollover time and the clock."], [43.3, "Click it again to hide them."]]}, {"id": "T19", "file": "T19_price_alerts.mp4", "thumb": "thumbs/T19.jpg", "section": "Alerts & news", "title": "Set a price alert", "summary": "Get told when a price reaches your level.", "dur": 46, "cues": [[2.1, "A price alert tells you when a price reaches a level you choose."], [5.9, "Select an instrument in the watchlist, then press Alt+P."], [9.0, "The alert window opens on that instrument and shows its live prices."], [12.9, "Choose whether to watch the Bid or the Ask price."], [16.7, "The alert rate starts at the current price."], [20.1, "The arrows nudge it up or down."], [23.8, "Or type the price you want."], [26.4, "The line below tells you what will trigger the alert."], [30.2, "Click Set Alert."], [35.1, "Your alerts are listed on the Summary tab."], [40.0, "Here it is, waiting for the price to get there. Alerts are kept on the server."]]}, {"id": "T28", "file": "T28_news.mp4", "thumb": "thumbs/T28.jpg", "section": "Alerts & news", "title": "Show market news", "summary": "The latest market news next to your chart.", "dur": 38, "cues": [[2.1, "ActTrader can show the latest market news next to your chart."], [6.0, "Open Panels on the right."], [8.9, "Switch on News panel."], [13.9, "The news appears on the right, newest first."], [18.3, "Each story shows where it came from and when."], [22.7, "Click a headline to read the full story in your web browser."], [28.6, "Scroll down for older stories."], [32.5, "You can choose your news sources under News Feeds."]]}, {"id": "T60", "file": "T60_manage_price_alerts.mp4", "thumb": "thumbs/T60.jpg", "section": "Alerts var state = { q: "", section: "All" };
try { var s = JSON.parse(localStorage.getItem("howto-state") || "{}"); if (s.section) state.section = s.section; } catch (e) {}

function esc(s) { return s.replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function norm(s) { return s.toLowerCase(); }
function words(q) { return norm(q).split(/\s+/).filter(Boolean); }
function hl(text, ws) {
  var out = esc(text);
  ws.forEach(function (w) {
    var re = new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    out = out.replace(re, "<mark>$1</mark>");
  });
  return out;
}
function fmt(t) { t = Math.floor(t); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }

function match(v, ws) {
  if (!ws.length) return { ok: true, score: 0, hits: [] };
  var head = norm(v.title + " " + v.summary + " " + v.section), score = 0, hits = [];
  var all = ws.every(function (w) {
    var inHead = head.indexOf(w) >= 0;
    var inCue = v.cues.some(function (c) { return norm(c[1]).indexOf(w) >= 0; });
    if (inHead) score += 10;
    return inHead || inCue;
  });
  if (!all) return { ok: false };
  v.cues.forEach(function (c) {
    var n = norm(c[1]);
    if (ws.some(function (w) { return n.indexOf(w) >= 0; })) hits.push(c);
  });
  score += hits.length;
  return { ok: true, score: score, hits: hits.slice(0, 3) };
}

function card(v, m, ws) {
  var hits = "";
  if (m.hits && m.hits.length) {
    hits = '<ul class="hits">' + m.hits.map(function (c) {
      return '<li><a href="' + esc(v.file) + "#t=" + c[0] + '" data-t="' + c[0] + '">' + fmt(c[0]) + "</a><span>" + hl(c[1], ws) + "</span></li>";
    }).join("") + "</ul>";
  }
  return '<div class="card" tabindex="0" role="button" data-id="' + v.id + '" aria-label="' + esc(v.title) + '">' +
    '<div class="thumb"><img loading="lazy" src="' + esc(v.thumb) + '" alt=""><span class="dur">' + fmt(v.dur) + "</span>" +
    '<div class="play"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span></div></div>' +
    '<div class="body"><p class="title">' + hl(v.title, ws) + '</p><p class="sum">' + hl(v.summary, ws) + "</p>" + hits + "</div></div>";
}

function render() {
  var ws = words(state.q), shown = 0, html = "";
  var inSec = DATA.videos.filter(function (v) { return state.section === "All" || v.section === state.section; });
  if (ws.length) {
    var res = inSec.map(function (v) { return { v: v, m: match(v, ws) }; })
                   .filter(function (r) { return r.m.ok; })
                   .sort(function (a, b) { return b.m.score - a.m.score; });
    shown = res.length;
    if (res.length) html = '<div class="grid">' + res.map(function (r) { return card(r.v, r.m, ws); }).join("") + "</div>";
  } else {
    DATA.sections.forEach(function (sec) {
      var vs = inSec.filter(function (v) { return v.section === sec; });
      if (!vs.length) return;
      shown += vs.length;
      html += "<h2>" + esc(sec) + '</h2><div class="grid">' + vs.map(function (v) { return card(v, { hits: [] }, []); }).join("") + "</div>";
    });
  }
  document.getElementById("list").innerHTML = html || '<div class="empty">No videos match “' + esc(state.q) + '”. Try another word.</div>';
  document.getElementById("count").textContent = shown + (shown === 1 ? " video" : " videos");
}

function chips() {
  var counts = {};
  DATA.videos.forEach(function (v) { counts[v.section] = (counts[v.section] || 0) + 1; });
  var list = ["All"].concat(DATA.sections);
  document.getElementById("chips").innerHTML = list.map(function (s) {
    var n = s === "All" ? DATA.videos.length : (counts[s] || 0);
    return '<button class="chip" aria-pressed="' + (state.section === s) + '" data-s="' + esc(s) + '">' + esc(s) + '<span class="n">' + n + "</span></button>";
  }).join("");
}

var player = document.getElementById("player"), vid = document.getElementById("vid");
function openVideo(id, t) {
  var v = DATA.videos.filter(function (x) { return x.id === id; })[0];
  if (!v) return;
  vid.src = v.file + (t ? "#t=" + t : "");
  document.getElementById("ptitle").textContent = v.title;
  document.getElementById("pdl").href = v.file;
  player.classList.add("open");
  vid.play && vid.play().catch(function () {});
  history.replaceState(null, "", "#" + v.id + (t ? "-" + t : ""));
}
function closeVideo() { vid.pause(); vid.removeAttribute("src"); vid.load(); player.classList.remove("open");
  history.replaceState(null, "", location.pathname + location.search); }

document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
document.getElementById("chips").addEventListener("click", function (e) {
  var b = e.target.closest(".chip"); if (!b) return;
  state.section = b.getAttribute("data-s");
  try { localStorage.setItem("howto-state", JSON.stringify({ section: state.section })); } catch (x) {}
  chips(); render();
});
document.getElementById("list").addEventListener("click", function (e) {
  var a = e.target.closest("a[data-t]"), c = e.target.closest(".card");
  if (!c) return;
  e.preventDefault();
  openVideo(c.getAttribute("data-id"), a ? a.getAttribute("data-t") : 0);
});
document.getElementById("list").addEventListener("keydown", function (e) {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")) {
    e.preventDefault(); openVideo(e.target.getAttribute("data-id"), 0);
  }
});
document.getElementById("pclose").addEventListener("click", closeVideo);
player.addEventListener("click", function (e) { if (e.target === player) closeVideo(); });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && player.classList.contains("open")) closeVideo();
  else if (e.key === "/" && document.activeElement.id !== "q") { e.preventDefault(); document.getElementById("q").focus(); }
});

// Deep links: index.html?q=stop+loss, index.html?section=Charts, index.html#T21 or #T21-12.5
(function () {
  var p = new URLSearchParams(location.search);
  if (p.get("q")) { state.q = p.get("q"); document.getElementById("q").value = state.q; }
  if (p.get("section") && DATA.sections.indexOf(p.get("section")) >= 0) state.section = p.get("section");
  chips(); render();
  var h = location.hash.replace("#", "");
  if (h) { var m = h.split("-"); openVideo(m[0], m[1] || 0); }
})();
</script>
